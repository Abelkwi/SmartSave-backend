<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Send Message</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f8f4; color: #1b5e20; padding: 24px; }
        .card { background: white; border-radius: 16px; padding: 20px; max-width: 480px; margin: auto; box-shadow: 0 8px 24px rgba(27,94,32,0.08); }
        .btn { display: inline-block; background: #1b5e20; color: white; padding: 8px 12px; border-radius: 999px; border: none; cursor: pointer; }
        input, textarea { width: 100%; padding: 8px; margin-bottom: 10px; border: 1px solid #dce8dc; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Send Message</h2>
        <form method="post">
            {% csrf_token %}
            <input type="text" name="subject" placeholder="Subject" required>
            <textarea name="body" placeholder="Write your message..." rows="5" required></textarea>
            <button class="btn" type="submit">Send</button>
        </form>
        <p><a href="{% url 'marketplace:dashboard' %}">Back to dashboard</a></p>
    </div>
</body>
</html>
