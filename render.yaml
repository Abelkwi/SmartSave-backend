# Render Blueprint for SMARTSAVE Backend
# https://render.com/docs/blueprint-spec

databases:
  - name: smartsave-db
    plan: free
    databaseName: smartsave_db
    user: smartsave_user

services:
  - type: web
    name: smartsave-backend
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn core.wsgi:application --workers 2 --timeout 120
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: RENDER_EXTERNAL_HOSTNAME
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: smartsave-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: "https://your-frontend-domain.com,http://localhost:8000,http://127.0.0.1:8000"
      - key: SECURE_SSL_REDIRECT
        value: "True"